services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    ports:
      - "8501:8501"
    environment:
      BACKEND_URL: http://backend:8000
      # Optional: s3://bucket/folder/streamlit_config.json
      STREAMLIT_CONFIG_S3_URI: ${STREAMLIT_CONFIG_S3_URI:-}
    depends_on:
      - backend
    restart: unless-stopped
